[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-eval-benchmark"
version = "0.1.0"
description = "Frozen VLM evaluation, automatic scoring, and interactive offline radar charts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-VLMEvalKit", "NOTICE"]
dependencies = ["pillow>=10"]

[project.optional-dependencies]
datasets = ["huggingface-hub>=0.27", "pyarrow>=15", "av>=12", "numpy>=1.26"]
dev = ["pytest>=8", "build>=1"]

[project.urls]
Repository = "https://github.com/CaMi1le/vlm-eval-benchmark"
Issues = "https://github.com/CaMi1le/vlm-eval-benchmark/issues"

[project.scripts]
vlmbench = "vlmbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlmbench = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
