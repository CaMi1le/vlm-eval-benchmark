name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: python -m pip install -e '.[datasets,dev]'
      - name: Check public contents
        run: python scripts/check_public_tree.py
      - name: Run offline regression suite
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
      - name: Install wheel and run without source checkout
        shell: bash
        run: |
          python -m venv /tmp/vlm-wheel
          /tmp/vlm-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/vlm-wheel/bin/vlmbench demo --output demo-output
          /tmp/vlm-wheel/bin/python -c "from vlmbench.benchmark_score import UNIT_FILE; assert UNIT_FILE.is_file()"
